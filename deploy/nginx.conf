# nginx site config — copy to /etc/nginx/sites-available/ira and symlink into
# sites-enabled, then run certbot to add the certificate.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ira
#   sudo ln -s /etc/nginx/sites-available/ira /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.ir -d www.example.ir
#
# Replace example.ir with the real domain in all three places.

server {
    listen 80;
    listen [::]:80;
    server_name example.ir www.example.ir;

    # certbot rewrites this block to redirect to HTTPS once the certificate
    # is issued; leave it plain until then so the challenge can be served.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js fingerprints these filenames, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and fonts change rarely and keep their names, so cache for a day.
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # The panel must never be cached or indexed.
    location /admin {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store";
        add_header         X-Robots-Tag  "noindex, nofollow";
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
